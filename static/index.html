<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZooKeeper Explorer</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2939;background:#f5f7fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid #eaecf0;display:flex;align-items:center;padding:0 30px;gap:12px}.logo{width:34px;height:34px;border-radius:10px;background:#1677ff;color:#fff;display:grid;place-items:center;font-weight:700}.brand{font-size:15px;font-weight:650}.top-tag{font-size:11px;color:#1677ff;background:#eff6ff;padding:4px 8px;border-radius:20px;margin-left:5px}.profile{margin-left:auto;color:#667085;font-size:13px}.layout{max-width:1440px;margin:auto;padding:30px;display:grid;grid-template-columns:260px 1fr;gap:24px}.sidebar,.panel,.detail{background:white;border:1px solid #eaecf0;border-radius:12px;box-shadow:0 2px 6px #10182808}.sidebar{height:calc(100vh - 124px);min-height:540px;padding:18px 12px}.side-title{padding:5px 10px 14px;color:#98a2b3;font-size:11px;font-weight:650;letter-spacing:.08em}.cluster{width:100%;border:0;background:transparent;padding:11px 10px;display:flex;align-items:center;text-align:left;border-radius:8px;cursor:pointer;color:#344054;margin:2px 0}.cluster:hover{background:#f8fafc}.cluster.active{background:#eff6ff;color:#175cd3}.cluster-icon{width:31px;height:31px;border:1px solid #eaecf0;border-radius:8px;background:#fff;display:grid;place-items:center;margin-right:10px;color:#667085}.active .cluster-icon{color:#1677ff;border-color:#d1e0ff}.cluster-text{min-width:0}.cluster-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cluster-host{font-family:ui-monospace,monospace;font-size:10px;color:#98a2b3;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0}.heading{display:flex;align-items:flex-start;margin:4px 0 22px}.heading h1{margin:0 0 6px;font-size:22px;letter-spacing:-.03em}.sub{font-size:13px;color:#667085}.status{margin-left:auto;display:flex;align-items:center;gap:7px;border:1px solid #d1fadf;background:#f6fef9;color:#039855;border-radius:20px;padding:6px 10px;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#12b76a}.toolbar{padding:15px 18px;border-bottom:1px solid #eaecf0;display:flex;align-items:center;gap:10px}.crumbs{font-family:ui-monospace,monospace;font-size:13px;display:flex;align-items:center;gap:3px;min-width:0;overflow:auto}.crumb{border:0;background:transparent;padding:5px 6px;color:#475467;border-radius:5px;cursor:pointer;white-space:nowrap}.crumb:hover{background:#f2f4f7}.crumb.current{color:#101828;font-weight:650;cursor:default}.refresh{margin-left:auto;border:1px solid #d0d5dd;background:white;border-radius:7px;padding:7px 10px;color:#344054;cursor:pointer;font-size:12px}.refresh:hover{background:#f9fafb}.content{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;padding:18px}.panel{overflow:hidden}.table-head,.row{display:grid;grid-template-columns:minmax(160px,1fr) 105px 95px;align-items:center;gap:10px;padding:12px 18px}.table-head{background:#fcfcfd;color:#667085;font-size:11px;border-bottom:1px solid #eaecf0}.row{border-bottom:1px solid #f2f4f7;min-height:58px}.row:last-child{border-bottom:0}.name-cell{display:flex;align-items:center;gap:10px;min-width:0}.node-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:#fffaeb;color:#dc6803;flex:none}.node-icon.file{background:#f2f4f7;color:#667085}.node-name{font-size:13px;font-weight:550;color:#344054;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node-sub{font:10px ui-monospace,monospace;color:#98a2b3;margin-top:4px}.type{font-size:11px;color:#667085}.count{font-size:11px;color:#667085}.open-node{cursor:pointer}.open-node:hover{background:#f9fbff}.empty{height:230px;display:grid;place-content:center;text-align:center;color:#98a2b3;font-size:13px}.detail{padding:18px;min-height:260px}.detail h3{font-size:13px;margin:0 0 16px}.detail-label{font-size:10px;letter-spacing:.07em;color:#98a2b3;text-transform:uppercase;margin:18px 0 7px}.pathval{font:11px ui-monospace,monospace;word-break:break-all;color:#475467;background:#f9fafb;border:1px solid #eaecf0;border-radius:7px;padding:9px}.data{font:11px ui-monospace,monospace;line-height:1.6;color:#475467;background:#101828;color:#d0d5dd;border-radius:8px;padding:12px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}.meta{font-size:12px;color:#667085}.welcome{grid-column:1/-1;text-align:center;padding:90px 20px;color:#667085}.welcome strong{display:block;color:#344054;font-size:16px;margin:14px}.alert{color:#b42318;background:#fef3f2;border:1px solid #fecdca;padding:11px 13px;border-radius:8px;font-size:12px;margin:0 18px 16px}.footer{padding:12px 18px;border-top:1px solid #eaecf0;color:#98a2b3;font-size:10px;display:flex;justify-content:space-between}@media(max-width:1000px){.layout{grid-template-columns:210px 1fr;padding:20px;gap:15px}.content{grid-template-columns:1fr}.detail{min-height:0}}@media(max-width:680px){.layout{display:block;padding:15px}.sidebar{height:auto;min-height:0;margin-bottom:16px}.cluster-list{display:flex;overflow:auto}.cluster{min-width:190px;width:auto}.topbar{padding:0 16px}.heading h1{font-size:19px}.table-head,.row{grid-template-columns:minmax(130px,1fr) 76px 70px;padding:11px}.detail{margin-top:0}}
  </style>
  <style>
    .detail-actions{display:flex;gap:8px;margin:10px 0 16px}.action-link,.action-button,.format-select{font:inherit;font-size:12px;border:1px solid #d0d5dd;background:#fff;border-radius:7px;padding:7px 10px;color:#344054;text-decoration:none;cursor:pointer}.action-link:hover,.action-button:hover{background:#f9fafb}.action-button.danger{color:#b42318;border-color:#fecdca}.action-button.danger:hover{background:#fef3f2}.format-bar{display:flex;align-items:center;gap:8px;margin:16px 0 7px}.format-bar .detail-label{margin:0 auto 0 0}.format-select{padding:5px 8px}.data .token-key{color:#84caff}.data .token-string{color:#a6f4c5}.data .token-number{color:#fdb022}.data .token-bool{color:#d6bbfb}.data .token-null{color:#fda29b}.data .token-punctuation{color:#98a2b3}.data .token-comment{color:#98a2b3;font-style:italic}
  </style>
  <style>
    .node-icon.loading{background:#f2f4f7;color:#98a2b3}.metadata-error{color:#b42318}.meta-retry{border:0;background:transparent;color:#b42318;cursor:pointer;font:inherit;padding:0}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="logo">Z</div><div class="brand">ZooKeeper Explorer <span class="top-tag">BROWSER</span></div><div class="profile">节点管理</div></header>
  <div class="layout">
    <aside class="sidebar"><div class="side-title">CLUSTERS <span id="clusterCount"></span></div><div id="clusters" class="cluster-list"></div></aside>
    <main class="main">
      <div class="heading"><div><h1 id="title">选择一个集群</h1><div class="sub" id="subtitle">从左侧选择 ZooKeeper 集群，浏览节点树和节点数据</div></div><div class="status"><span class="dot"></span><span id="state">服务已就绪</span></div></div>
      <section class="panel">
        <div class="toolbar"><nav class="crumbs" id="crumbs"></nav><button class="refresh" id="refresh">↻　刷新</button></div>
        <div id="error"></div>
        <div class="content" id="content"><div class="welcome"><div style="font-size:30px;color:#d0d5dd">⌘</div><strong>欢迎使用 ZooKeeper Explorer</strong>选择一个集群开始浏览</div></div>
        <div class="footer"><span>ZooKeeper 节点浏览器</span><span id="summary">按需读取节点数据</span></div>
      </section>
    </main>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);let clusters=[],active=-1,currentPath='/',selected=null,formatMode='auto',allowDelete=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){try{const [clusterResponse,settingsResponse]=await Promise.all([fetch('/api/clusters'),fetch('/api/settings')]);clusters=await clusterResponse.json();if(settingsResponse.ok)allowDelete=(await settingsResponse.json()).allow_delete===true;$('clusterCount').textContent=`· ${clusters.length}`;$('clusters').innerHTML=clusters.length?clusters.map((c,i)=>`<button class="cluster" data-id="${i}"><span class="cluster-icon">◈</span><span class="cluster-text"><div class="cluster-name">${esc(c.name)}</div><div class="cluster-host">${esc(c.address)}</div></span></button>`).join(''):'<div style="padding:10px;color:#98a2b3;font-size:12px">未配置集群</div>';$('clusters').querySelectorAll('.cluster').forEach(b=>b.onclick=()=>choose(+b.dataset.id));if(clusters.length)choose(0)}catch(e){error('无法加载集群列表')}}
function choose(id){active=id;currentPath='/';selected=null;formatMode='auto';document.querySelectorAll('.cluster').forEach((b,i)=>b.classList.toggle('active',i===id));$('title').textContent=clusters[id].name;$('subtitle').textContent=clusters[id].address;load()}
async function load(path=currentPath){if(active<0)return;if(nodeMetadataObserver)nodeMetadataObserver.disconnect();if(path!==currentPath)formatMode='auto';currentPath=path;$('state').textContent='正在读取';$('error').innerHTML='';$('content').innerHTML='<div class="welcome">正在读取 ZooKeeper 节点…</div>';try{const r=await fetch(`/api/clusters/${active}/nodes?path=${encodeURIComponent(path)}`);const body=await r.text();if(!r.ok)throw Error(body||'读取失败');render(JSON.parse(body))}catch(e){$('content').innerHTML='';error(e.message);$('state').textContent='连接异常'}}
function error(msg){$('error').innerHTML=`<div class="alert">${esc(msg)}</div>`;$('summary').textContent='请检查地址、网络或访问权限'}
function render(d){
  $('state').textContent='连接正常';
  $('crumbs').innerHTML=crumbHTML(d.path);
  $('crumbs').querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>load(b.dataset.path));
  $('summary').textContent=`${d.nodes.length} 个子节点 · 节点数据 ${d.data_len} 字节`;
  const rows=d.nodes.map(n=>`<div class="row open-node" data-path="${esc(n.path)}" data-cluster="${active}">
    <div class="name-cell"><span class="node-icon loading">…</span><div style="min-width:0"><div class="node-name">${esc(n.name)}</div><div class="node-sub">${esc(n.path)}</div></div></div>
    <div class="type">加载中</div><div class="count">加载中</div></div>`).join('');
  const isText=d.data!==null,encodedPath=encodeURIComponent(d.path);
  const detail=d.path==='/'?'<div class="detail"><h3>节点详情</h3><div class="meta">选择具体节点以查看其数据内容。</div></div>':`<div class="detail"><h3>节点详情</h3><div class="detail-label">完整路径</div><div class="pathval">${esc(d.path)}</div><div class="detail-actions"><a class="action-link" href="/api/clusters/${active}/node/download?path=${encodedPath}">⇩ 下载内容</a>${allowDelete?'<button class="action-button danger" id="deleteNode">删除节点</button>':''}</div><div class="format-bar"><div class="detail-label">数据内容 · ${d.data_len} B</div>${isText?`<select id="formatMode" class="format-select" aria-label="内容格式"><option value="auto">自动识别</option><option value="plain">纯文本</option><option value="json">JSON</option><option value="yaml">YAML</option></select>`:''}</div><pre class="data" id="nodeData">${isText?formatText(d.data,formatMode,d.path):(d.data_base64?`二进制数据（Base64）\n${esc(d.data_base64)}`:'（空）')}</pre><div class="detail-label">编码</div><div class="meta">${isText?'UTF-8 文本':'Base64 二进制'}</div></div>`;
  $('content').innerHTML=`<div class="panel" style="box-shadow:none"><div class="table-head"><div>名称</div><div>类型</div><div>子节点 / 大小</div></div>${rows||'<div class="empty">此节点下没有子节点</div>'}</div>${detail}`;
  $('content').querySelectorAll('.open-node').forEach(row=>row.onclick=()=>load(row.dataset.path));
  const selector=$('formatMode');
  if(selector){selector.value=formatMode;selector.onchange=()=>{formatMode=selector.value;$('nodeData').innerHTML=formatText(d.data,formatMode,d.path)}}
  const deleteButton=$('deleteNode');
  if(deleteButton)deleteButton.onclick=()=>removeNode(d.path);
  observeNodeRows();
}
const nodeMetadataCache=new Map(),nodeMetadataRequests=new Map();
let nodeMetadataObserver=null;
async function fetchNodeMetadata(clusterId,path){
  const key=`${clusterId}:${path}`;
  if(nodeMetadataCache.has(key))return nodeMetadataCache.get(key);
  if(nodeMetadataRequests.has(key))return nodeMetadataRequests.get(key);
  const request=(async()=>{const r=await fetch(`/api/clusters/${clusterId}/node/metadata?path=${encodeURIComponent(path)}`);const body=await r.text();if(!r.ok)throw Error(body||'读取节点信息失败');const metadata=JSON.parse(body);nodeMetadataCache.set(key,metadata);return metadata})();
  nodeMetadataRequests.set(key,request);
  try{return await request}finally{nodeMetadataRequests.delete(key)}
}
function applyNodeMetadata(row,metadata){
  if(!row.isConnected)return;
  const icon=row.querySelector('.node-icon'),type=row.querySelector('.type'),count=row.querySelector('.count');
  icon.classList.remove('loading');icon.classList.toggle('file',!metadata.is_dir);icon.textContent=metadata.is_dir?'▰':'▤';
  type.textContent=metadata.is_dir?'目录':'节点';type.classList.remove('metadata-error');
  count.textContent=metadata.children_count?`${metadata.children_count} 项`:`${metadata.data_len} B`;
}
function showMetadataError(row){
  if(!row.isConnected)return;
  const icon=row.querySelector('.node-icon'),type=row.querySelector('.type'),count=row.querySelector('.count');
  icon.classList.remove('loading');icon.textContent='!';type.textContent='加载失败';type.classList.add('metadata-error');
  count.innerHTML='<button class="meta-retry" type="button">重试</button>';
  count.querySelector('button').onclick=event=>{event.stopPropagation();loadNodeMetadata(row)};
}
async function loadNodeMetadata(row){
  try{const metadata=await fetchNodeMetadata(row.dataset.cluster,row.dataset.path);applyNodeMetadata(row,metadata)}
  catch(_error){showMetadataError(row)}
}
function observeNodeRows(){
  if(nodeMetadataObserver)nodeMetadataObserver.disconnect();
  const rows=[...$('content').querySelectorAll('.open-node')];
  if(!('IntersectionObserver' in window)){rows.forEach(loadNodeMetadata);return}
  nodeMetadataObserver=new IntersectionObserver(entries=>{
    for(const entry of entries){if(entry.isIntersecting){nodeMetadataObserver.unobserve(entry.target);loadNodeMetadata(entry.target)}}
  },{root:null,rootMargin:'0px',threshold:0});
  rows.forEach(row=>nodeMetadataObserver.observe(row));
}
function formatText(text,mode,path){const inferred=mode==='auto'?(/\.json$/i.test(path)?'json':/\.ya?ml$/i.test(path)?'yaml':'plain'):mode;if(inferred==='json')return highlightJson(text);if(inferred==='yaml')return highlightYaml(text);return esc(text)}
function spanToken(token,type){return `<span class="token-${type}">${esc(token)}</span>`}
function highlightJson(text){const pattern=/("(?:\\.|[^"\\])*"(?=\s*:))|("(?:\\.|[^"\\])*")|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|(true\b|false\b)|(null\b)|([{}\[\],:])/g;let out='',last=0,match;while((match=pattern.exec(text))){out+=esc(text.slice(last,match.index));const type=match[1]?'key':match[2]?'string':match[3]?'number':match[4]?'bool':match[5]?'null':'punctuation';out+=spanToken(match[0],type);last=pattern.lastIndex}return out+esc(text.slice(last))}
function highlightYaml(text){const pattern=/(#[^\n]*|"(?:\\.|[^"\\])*"|'[^']*'|^[ \t]*[A-Za-z0-9_.-]+(?=\s*:)|\b(?:true|false)\b|\b(?:null|~)\b|\b-?\d+(?:\.\d+)?\b)/gm;let out='',last=0,match;while((match=pattern.exec(text))){out+=esc(text.slice(last,match.index));const token=match[0],type=token.startsWith('#')?'comment':/^\s*[A-Za-z0-9_.-]+$/.test(token)&&text.slice(pattern.lastIndex).match(/^\s*:/)?'key':/^['"]/.test(token)?'string':/^(?:true|false)$/.test(token)?'bool':/^(?:null|~)$/.test(token)?'null':'number';out+=spanToken(token,type);last=pattern.lastIndex}return out+esc(text.slice(last))}
async function removeNode(path){if(!confirm(`将递归删除节点及其全部子节点，操作不可恢复。\n\n${path}\n\n确定继续吗？`))return;const button=$('deleteNode');button.disabled=true;button.textContent='正在删除…';try{const r=await fetch(`/api/clusters/${active}/nodes?path=${encodeURIComponent(path)}`,{method:'DELETE'});const body=await r.text();if(!r.ok)throw Error(body||'删除失败');const result=JSON.parse(body);alert(`删除完成：共删除 ${result.deleted_nodes} 个节点。`);const parent=path.slice(0,path.lastIndexOf('/'))||'/';load(parent)}catch(e){alert(`删除未完成：${e.message}`);load(currentPath)}}
function crumbHTML(path){const parts=path.split('/').filter(Boolean);let out=`<button class="crumb ${path==='/'?'current':''}" data-path="/">⌂ 根目录</button>`,built='';parts.forEach((p,i)=>{built+='/'+p;out+=`<span style="color:#d0d5dd">/</span><button class="crumb ${i===parts.length-1?'current':''}" data-path="${esc(built)}">${esc(p)}</button>`});return out}
$('refresh').onclick=()=>load();init();
</script>
</body>
</html>
